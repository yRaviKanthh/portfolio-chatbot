<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rio</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#f1f5f9;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.chat-container{
  width:380px;
  height:700px;
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(0,0,0,0.2);
  display:flex;
  flex-direction:column;
}

.header{
  background:#10b981;
  color:white;
  padding:20px;
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:white;
}

.chat-box{
  flex:1;
  padding:20px;
  overflow-y:auto;
  background:#f8fafc;
}

.message{
  margin-bottom:15px;
  display:flex;
}

.user{
  justify-content:flex-end;
}

.bot{
  justify-content:flex-start;
}

.bubble{
  max-width:75%;
  padding:12px 16px;
  border-radius:15px;
  font-size:15px;
  line-height:1.5;
}
.time{
  font-size:11px;
  margin-top:5px;
  opacity:0.7;
}

.user .bubble{
  background:#10b981;
  color:white;
  border-bottom-right-radius:5px;
}

.bot .bubble{
  background:white;
  color:black;
  border-bottom-left-radius:5px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.input-area{
  padding:15px;
  display:flex;
  gap:10px;
  border-top:1px solid #ddd;
}

input{
  flex:1;
  padding:15px;
  border:none;
  background:#f1f5f9;
  border-radius:30px;
  outline:none;
}

button{
  width:50px;
  height:50px;
  border:none;
  border-radius:50%;
  background:#10b981;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.typing{
  display:flex;
  gap:5px;
  align-items:center;
  min-width:50px;
  min-height:20px;
}

.typing span{
  width:8px;
  height:8px;
  background:gray;
  border-radius:50%;
  animation:bounce 1.4s infinite;
}

.typing span:nth-child(2){
  animation-delay:0.2s;
}

.typing span:nth-child(3){
  animation-delay:0.4s;
}

@keyframes bounce{

  0%,80%,100%{
    transform:scale(0);
  }

  40%{
    transform:scale(1);
  }

}

</style>

</head>

<body>

<div class="chat-container">

  <div class="header">

    <div class="avatar"></div>

    <div>
      <h2>Bondvue</h2>
      <p>Online</p>
    </div>

  </div>

  <div class="chat-box" id="chatBox">

    <div class="message bot">
      <div class="bubble">
        Hello 👋 <br>
        How can I help you today?
      </div>
    </div>

  </div>

  <div class="input-area">

    <input
      type="text"
      id="message"
      placeholder="Type your message..."
    >

    <button onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>

<script>
let chatHistory = [];
async function sendMessage(){

  const input =
    document.getElementById("message");

  const message =
    input.value.trim();

  if(!message) return;

  const chatBox =
  document.getElementById("chatBox");

const time =
  new Date().toLocaleTimeString(
    [],
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );



  /// USER MESSAGE
chatBox.innerHTML += `
  <div class="message user">
    <div class="bubble">
      ${message}

      <div class="time">
        ${time}
      </div>

    </div>
  </div>
`;

  input.value = "";

  // TYPING
chatBox.innerHTML += `
  <div class="message bot" id="typing">
    <div class="bubble typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
`;

  chatBox.scrollTop =
    chatBox.scrollHeight;

  try{

    const res = await fetch("/chat",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
  message:message,
  history: chatHistory
})

    });

    const data =
      await res.json();

    const typing =
      document.getElementById("typing");

    if(typing){
      typing.remove();
    }




    chatHistory.push({
  role:"user",
  content:message
});

   // TEXT
if(data.reply){

  const botMessage =
    document.createElement("div");

  botMessage.className =
    "message bot";

  botMessage.innerHTML = `
    <div class="bubble">
      <span class="typing-text"></span>
    </div>
  `;

  chatBox.appendChild(botMessage);

  const typingText =
    botMessage.querySelector(
      ".typing-text"
    );

  let index = 0;

  const typingEffect =
    setInterval(() => {

      typingText.innerHTML +=
        data.reply.charAt(index);

      index++;

      chatBox.scrollTo({
        top: chatBox.scrollHeight,
        behavior: "smooth"
      });

      if(index >= data.reply.length){

  clearInterval(
    typingEffect
  );

  chatHistory.push({
    role:"assistant",
    content:data.reply
  });

}

    }, 15);

}

    // IMAGE
    if(data.image){

      chatBox.innerHTML += `
        <div class="message bot">
          <div class="bubble">
            <img
              src="data:image/png;base64,${data.image}"
              style="width:100%; border-radius:10px;"
            >
          </div>
        </div>
      `;
    }

    chatBox.scrollTop =
      chatBox.scrollHeight;

  }

  catch(error){

    console.log(error);

    const typing =
      document.getElementById("typing");

    if(typing){
      typing.remove();
    }

    chatBox.innerHTML += `
      <div class="message bot">
        <div class="bubble">
          Server Error
        </div>
      </div>
    `;
  }

}

document
  .getElementById("message")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){

        e.preventDefault();

        sendMessage();

      }

    }
  );

</script>

</body>
</html>
